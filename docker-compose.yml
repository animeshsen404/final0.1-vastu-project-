version: '3.9'

services:
  # ---------------------------------------------------------------------------
  # Production Application Service
  # Run with: docker compose up -d --build app db
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: vastu-ritam-prod
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-vastu-ritam-super-secret-key-2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SQL_HOST: db
      SQL_DB_NAME: ${SQL_DB_NAME:-vastu_ritam}
      SQL_USER: ${SQL_USER:-postgres}
      SQL_PASSWORD: ${SQL_PASSWORD:-postgres}
      DB_POOL_MAX: ${DB_POOL_MAX:-25}
    volumes:
      - vastu_uploads:/app/public/uploads
      - ./data-store.json:/app/data-store.json
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - vastu-network

  # ---------------------------------------------------------------------------
  # Development Application Service (Live Reload via Vite + tsx)
  # Run with: docker compose --profile dev up --build app-dev db
  # ---------------------------------------------------------------------------
  app-dev:
    profiles:
      - dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: vastu-ritam-dev
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      APP_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET:-vastu-ritam-super-secret-key-2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SQL_HOST: db
      SQL_DB_NAME: ${SQL_DB_NAME:-vastu_ritam}
      SQL_USER: ${SQL_USER:-postgres}
      SQL_PASSWORD: ${SQL_PASSWORD:-postgres}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vastu-network

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 Database Service
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: vastu-ritam-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SQL_DB_NAME:-vastu_ritam}
      POSTGRES_USER: ${SQL_USER:-postgres}
      POSTGRES_PASSWORD: ${SQL_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vastu_pgdata:/var/lib/postgresql/data
      - ./drizzle/0000_simple_morbius.sql:/docker-entrypoint-initdb.d/0000_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER:-postgres} -d ${SQL_DB_NAME:-vastu_ritam}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vastu-network

volumes:
  vastu_pgdata:
  vastu_uploads:

networks:
  vastu-network:
    driver: bridge
